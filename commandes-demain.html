<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ordre de Fabrication & Coûts</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdf6ec; color: #3b2c1a; padding: 20px; margin: 0; }
    h1 { color: #7a4a1f; font-size: 1.4rem; margin-bottom: 5px; }
    .carte { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 15px; max-width: 900px; margin-bottom: 20px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9em; background: #fff; }
    th, td { border: 1px solid #e0d3bd; padding: 8px; text-align: center; }
    th { background: #7a4a1f; color: #fff; }
    select, input[type="number"] { padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; width: 100%; }
    .btn { background: #7a4a1f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; margin-right: 5px; }
    .btn-sup { background: #c0392b; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .status-bar { background: #efe0c8; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85em; font-weight: bold; color: #7a4a1f; }
    .total-box { background: #e8f8f5; color: #27ae60; font-weight: bold; font-size: 1.1em; padding: 10px; border-radius: 6px; text-align: right; margin-top: 10px; }
</style>

<!-- Firebase SDK Compat Version -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<h1>📋 Ordre de Fabrication du Jour</h1>
<div class="status-bar" id="statusBar">🔄 Chargement des recettes Firebase...</div>

<div class="carte">
    <table>
        <thead>
            <tr>
                <th style="width: 40%;">Produit (issu des Fiches Recettes)</th>
                <th style="width: 20%;">Quantité (pièces)</th>
                <th style="width: 20%;">Coût Unitaire (₱)</th>
                <th style="width: 20%;">Coût Total Matière (₱)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="corpsTableau"></tbody>
    </table>

    <button class="btn" onclick="ajouterLigne()">+ Ajouter un produit à la fournée</button>
    <button class="btn" style="background:#27ae60;" onclick="sauvegarderOF()">☁️ Enregistrer l'OF</button>

    <div class="total-box" id="totalGeneral">Coût total de la fournée : ₱ 0,00</div>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
      authDomain: "bakertools-ae124.firebaseapp.com",
      projectId: "bakertools-ae124",
      storageBucket: "bakertools-ae124.firebasestorage.app",
      messagingSenderId: "978584667113",
      appId: "1:978584667113:web:868cc89788aff27717c178",
      measurementId: "G-KQNS7J2NPX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let masterIngredients = [];
    let fichesRecettes = [];
    let ordreFabrication = [];

    function formatPeso(nombre) {
        return "₱ " + nombre.toLocaleString('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Calcul du coût unitaire par pièce d'une recette
    function calculerCoutUnitaire(recette) {
        if (!recette || !recette.ingredients || recette.nbPieces <= 0) return 0;

        let coutTotal = 0;
        recette.ingredients.forEach(ing => {
            const masterIng = masterIngredients.find(m => m.nom.toLowerCase().trim() === ing.nom.toLowerCase().trim());
            const prix = masterIng ? masterIng.prix : 0;
            const type = masterIng ? masterIng.type : 'kg';
            coutTotal += (type === 'kg') ? (ing.qte / 1000) * prix : ing.qte * prix;
        });

        return coutTotal / recette.nbPieces;
    }

    function initialiser() {
        // 1. Charger Ingrédients
        db.collection("ingredients").doc("master").onSnapshot(doc => {
            if (doc.exists) masterIngredients = doc.data().items || [];
            afficherTableau();
        });

        // 2. Charger Fiches Recettes
        db.collection("recettes").doc("fiches").onSnapshot(doc => {
            if (doc.exists) {
                fichesRecettes = doc.data().items || [];
                document.getElementById('statusBar').textContent = "✅ " + fichesRecettes.length + " recette(s) chargée(s) depuis Prix de Revient";
            }
            afficherTableau();
        });

        // 3. Charger Ordre de Fabrication du jour
        db.collection("production").doc("ordre_du_jour").onSnapshot(doc => {
            if (doc.exists && doc.data().items) {
                ordreFabrication = doc.data().items;
            } else if (ordreFabrication.length === 0) {
                ordreFabrication = [{ nom: "", qte: 0 }];
            }
            afficherTableau();
        });
    }

    function afficherTableau() {
        const corps = document.getElementById('corpsTableau');
        corps.innerHTML = '';
        let grandTotal = 0;

        ordreFabrication.forEach((item, index) => {
            // Trouver la recette sélectionnée dans la liste extraite
            const recetteTrouvee = fichesRecettes.find(r => r.nom.toLowerCase().trim() === item.nom.toLowerCase().trim());
            const coutUnitaire = recetteTrouvee ? calculerCoutUnitaire(recetteTrouvee) : 0;
            const coutTotalLigne = coutUnitaire * (item.qte || 0);
            grandTotal += coutTotalLigne;

            // Génération dynamique des options du menu déroulant
            let optionsHTML = `<option value="">-- Sélectionner un produit --</option>`;
            fichesRecettes.forEach(r => {
                const estSelectionne = r.nom.toLowerCase().trim() === item.nom.toLowerCase().trim() ? 'selected' : '';
                optionsHTML += `<option value="${r.nom}" ${estSelectionne}>${r.nom}</option>`;
            });

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td>
                    <select onchange="modifier(${index}, 'nom', this.value)">
                        ${optionsHTML}
                    </select>
                </td>
                <td>
                    <input type="number" min="0" value="${item.qte}" onchange="modifier(${index}, 'qte', parseInt(this.value)||0)">
                </td>
                <td>${formatPeso(coutUnitaire)}</td>
                <td style="font-weight:bold;">${formatPeso(coutTotalLigne)}</td>
                <td><button class="btn-sup" onclick="supprimer(${index})">X</button></td>
            `;
            corps.appendChild(tr);
        });

        document.getElementById('totalGeneral').textContent = "Coût total matière de la fournée : " + formatPeso(grandTotal);
    }

    function modifier(index, champ, valeur) {
        ordreFabrication[index][champ] = valeur;
        afficherTableau();
    }

    function ajouterLigne() {
        ordreFabrication.push({ nom: "", qte: 0 });
        afficherTableau();
    }

    function supprimer(index) {
        ordreFabrication.splice(index, 1);
        afficherTableau();
    }

    function sauvegarderOF() {
        db.collection("production").doc("ordre_du_jour").set({ items: ordreFabrication })
            .then(() => alert("Ordre de fabrication enregistré sur Firebase !"))
            .catch(err => alert("Erreur d'enregistrement : " + err.message));
    }

    window.addEventListener('DOMContentLoaded', initialiser);
</script>

</body>
</html>
