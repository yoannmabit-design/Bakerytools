<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Base Prix & Ingrédients</title>
<style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fdf6ec; color: #3b2c1a; padding: 20px; margin: 0; }
    h1 { color: #7a4a1f; font-size: 1.4rem; }
    p { font-size: 0.9rem; color: #6b5b45; margin-bottom: 15px; }
    .carte { background: #fff; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); padding: 15px; max-width: 900px; }
    table { border-collapse: collapse; width: 100%; font-size: 0.9em; }
    th, td { border: 1px solid #e0d3bd; padding: 8px; text-align: left; }
    th { background: #7a4a1f; color: #fff; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 6px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn { background: #7a4a1f; color: #fff; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; margin-right: 5px; }
    .btn-tri { background: #efe0c8; color: #7a4a1f; border: 1px solid #7a4a1f; padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 0.85em; font-weight: bold; }
    .btn-tri:hover { background: #7a4a1f; color: #fff; }
    .btn-sup { background: #c0392b; color: white; border: none; padding: 4px 8px; border-radius: 4px; cursor: pointer; }
    .status-bar { background: #efe0c8; padding: 8px 12px; border-radius: 6px; margin-bottom: 15px; font-size: 0.85em; font-weight: bold; color: #7a4a1f; }
    .toolbar-tri { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    /* Ajouter une marge de sécurité au bas de la page */
body {
    padding-bottom: 70px !important;
}
</style>

<!-- Firebase SDK Compat Version -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

<h1>🏷️ Gestion de la Base Ingrédients & Prix (₱)</h1>
<div class="status-bar" id="statusBar">🔄 Connexion à Firebase...</div>

<div class="toolbar-tri">
    <span style="font-size:0.85em; font-weight:bold; color:#6b5b45;">Trier par :</span>
    <button class="btn-tri" onclick="trierAlphabetique()">🔤 Nom (A-Z)</button>
    <button class="btn-tri" onclick="trierPrix('asc')">📈 Prix Croissant</button>
    <button class="btn-tri" onclick="trierPrix('desc')">📉 Prix Décroissant</button>
</div>

<div class="carte">
    <table>
        <thead>
            <tr>
                <th>Ingrédient</th>
                <th>Unité</th>
                <th>Prix unitaire (₱)</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="corpsTableau"></tbody>
    </table>

    <button class="btn" onclick="ajouterLigne()">+ Ajouter un ingrédient</button>
    <button class="btn" style="background:#27ae60;" onclick="sauvegarderCloud()">☁️ Enregistrer sur Firebase</button>
</div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyDuq8KS8M_Z8U7BlSp6MvE-6Y9OYYaDujE",
      authDomain: "bakertools-ae124.firebaseapp.com",
      projectId: "bakertools-ae124",
      storageBucket: "bakertools-ae124.firebasestorage.app",
      messagingSenderId: "978584667113",
      appId: "1:978584667113:web:868cc89788aff27717c178",
      measurementId: "G-KQNS7J2NPX"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    db.enablePersistence().catch(() => console.log("Mode hors-ligne actif."));

    const ingredientsParDefaut = [
        { nom: "Farine de blé", type: "kg", prix: 45 },
        { nom: "Farine de seigle", type: "kg", prix: 55 },
        { nom: "Farine complète", type: "kg", prix: 50 },
        { nom: "Farine", type: "kg", prix: 45 },
        { nom: "Beurre", type: "kg", prix: 380 },
        { nom: "Sucre", type: "kg", prix: 60 },
        { nom: "Œufs", type: "unite", prix: 8 },
        { nom: "Levure", type: "kg", prix: 250 },
        { nom: "Sel", type: "kg", prix: 25 },
        { nom: "Huile d'olive", type: "kg", prix: 400 },
        { nom: "Noix", type: "kg", prix: 600 },
        { nom: "Olives", type: "kg", prix: 350 },
        { nom: "Mix de graines", type: "kg", prix: 200 }
    ];

    let listeIngredients = [];
    let sensAlphabetique = true;

    function chargerDonnees() {
        db.collection("ingredients").doc("master").onSnapshot((doc) => {
            if (doc.exists && doc.data().items) {
                listeIngredients = doc.data().items;
                document.getElementById('statusBar').textContent = "✅ Synchronisé en temps réel avec le Cloud Firebase";
            } else {
                listeIngredients = ingredientsParDefaut;
                sauvegarderCloud();
            }
            afficherTableau();
        }, (err) => {
            document.getElementById('statusBar').textContent = "⚡ Mode Hors-Ligne (données locales)";
        });
    }

    function afficherTableau() {
        const corps = document.getElementById('corpsTableau');
        corps.innerHTML = '';
        listeIngredients.forEach((item, index) => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><input type="text" value="${item.nom}" onchange="modifier(${index}, 'nom', this.value)"></td>
                <td>
                    <select onchange="modifier(${index}, 'type', this.value)">
                        <option value="kg" ${item.type === 'kg' ? 'selected' : ''}>₱ / kg</option>
                        <option value="unite" ${item.type === 'unite' ? 'selected' : ''}>₱ / unité</option>
                    </select>
                </td>
                <td><input type="number" step="0.01" value="${item.prix}" onchange="modifier(${index}, 'prix', parseFloat(this.value) || 0)"></td>
                <td><button class="btn-sup" onclick="supprimer(${index})">X</button></td>
            `;
            corps.appendChild(tr);
        });
    }

    function trierAlphabetique() {
        listeIngredients.sort((a, b) => sensAlphabetique ? a.nom.localeCompare(b.nom) : b.nom.localeCompare(a.nom));
        sensAlphabetique = !sensAlphabetique;
        afficherTableau();
    }

    function trierPrix(ordre) {
        listeIngredients.sort((a, b) => ordre === 'asc' ? a.prix - b.prix : b.prix - a.prix);
        afficherTableau();
    }

    function modifier(index, champ, valeur) { listeIngredients[index][champ] = valeur; }
    function ajouterLigne() { listeIngredients.push({ nom: "Nouvel Ingrédient", type: "kg", prix: 0 }); afficherTableau(); }
    function supprimer(index) { listeIngredients.splice(index, 1); afficherTableau(); }

    function sauvegarderCloud() {
        db.collection("ingredients").doc("master").set({ items: listeIngredients })
            .then(() => alert("Données synchronisées sur tous vos appareils !"))
            .catch((err) => alert("Erreur d'enregistrement : " + err.message));
    }

    window.addEventListener('DOMContentLoaded', chargerDonnees);
</script>

</body>
</html>
