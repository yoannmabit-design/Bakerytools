<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yoann's French Bakery - Gestion</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #fdf6ec; color: #3b2c1a; overflow: hidden; }

    /* Barre latérale Ordinateur */
    nav {
      width: 260px;
      background-color: #1a1a1a;
      color: #fdf6ec;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 20px 0;
      flex-shrink: 0;
      border-right: 3px solid #7a4a1f;
    }
    
    .logo-container {
      text-align: center;
      padding: 0 15px 15px 15px;
      border-bottom: 1px solid #333;
      margin-bottom: 15px;
    }
    .logo-container img {
      display: block;
      margin: 0 auto;
      max-width: 140px;
      width: 100%;
      height: auto !important;
      object-fit: contain;
    }
    .logo-container h1 {
      font-size: 0.95rem;
      margin-top: 10px;
      color: #efe0c8;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    nav ul { list-style: none; }
    nav li {
      padding: 14px 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 0.95rem;
      color: #d0c4b2;
      transition: all 0.2s ease;
    }
    nav li:hover, nav li.active {
      background-color: #7a4a1f;
      color: #ffffff;
      font-weight: bold;
    }

    /* Footer Ordinateur (Masqué par défaut) */
    .mobile-footer { display: none; }

    /* Zone de contenu */
    main { flex-grow: 1; height: 100vh; overflow: auto; background: #fdf6ec; }
    .tab-content { display: none; height: 100%; width: 100%; border: none; }
    .tab-content.active { display: block; }

    /* Optimization Mobile */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      nav { 
        width: 100%; 
        height: auto; 
        padding: 0; 
        border-right: none; 
        border-bottom: 2px solid #7a4a1f; 
        justify-content: flex-start;
      }
      
      /* Masquer l'en-tête classique sur mobile */
      .logo-container { display: none; }

      nav ul { 
        display: flex; 
        flex-wrap: nowrap; 
        overflow-x: auto; 
        background: #1a1a1a; 
        -webkit-overflow-scrolling: touch;
      }
      nav li { 
        padding: 10px 12px; 
        font-size: 0.8rem; 
        flex: 0 0 auto; 
        text-align: center; 
        white-space: nowrap;
      }

      /* Affichage du petit footer sous les onglets */
      .mobile-footer {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        background: #111111;
        padding: 4px 10px;
        border-top: 1px solid #282828;
      }
      .mobile-footer img {
        height: 20px;
        width: auto;
        object-fit: contain;
      }
      .mobile-footer span {
        color: #efe0c8;
        font-size: 0.7rem;
        font-weight: 600;
        letter-spacing: 0.5px;
        text-transform: uppercase;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div>
      <div class="logo-container">
        <img src="logo.jpg" alt="Yoann's French Bakery Logo">
        <h1>Yoann's French Bakery</h1>
      </div>
      <ul>
        <li class="tab-btn active" onclick="showTab('tab-recettes', this)">🍞 Recettes</li>
        <li class="tab-btn" onclick="showTab('tab-sans-gluten', this)">🌾 Sans Gluten</li>
        <li class="tab-btn" onclick="showTab('tab-ingredients', this)">🏷️ Ingrédients & Prix</li>
        <li class="tab-btn" onclick="showTab('tab-couts', this)">💰 Prix de Revient</li>
        <li class="tab-btn" onclick="showTab('tab-commandes', this)">📋 Commandes Demain</li>
      </ul>
    </div>

    <!-- Mini Footer Mobile -->
    <div class="mobile-footer">
      <img src="logo.jpg" alt="Logo">
      <span>Yoann's French Bakery</span>
    </div>
  </nav>

  <main>
    <iframe id="tab-recettes" class="tab-content active" src="recettes.html"></iframe>
    <iframe id="tab-sans-gluten" class="tab-content" src="pain_sans_gluten.html"></iframe>
    <iframe id="tab-ingredients" class="tab-content" src="ingredients-master.html"></iframe>
    <iframe id="tab-couts" class="tab-content" src="prix-de-revient.html"></iframe>
    <iframe id="tab-commandes" class="tab-content" src="commandes-demain.html"></iframe>
  </main>

  <script>
    function showTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
