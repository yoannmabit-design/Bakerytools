<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Yoann's French Bakery - Gestion</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1a1a1a">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { display: flex; height: 100vh; background-color: #fdf6ec; color: #3b2c1a; overflow: hidden; }

    /* Barre latérale Ordinateur */
    nav {
      width: 260px;
      background-color: #1a1a1a;
      color: #fdf6ec;
      display: flex;
      flex-direction: column;
      padding: 15px 0;
      flex-shrink: 0;
      border-right: 3px solid #7a4a1f;
    }
    
    .app-title {
      text-align: center;
      padding: 0 10px 12px 10px;
      border-bottom: 1px solid #333;
      margin-bottom: 10px;
      font-size: 0.95rem;
      font-weight: bold;
      color: #efe0c8;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    nav ul { list-style: none; }
    nav li {
      padding: 12px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      color: #d0c4b2;
      transition: all 0.2s ease;
    }
    nav li:hover, nav li.active {
      background-color: #7a4a1f;
      color: #ffffff;
      font-weight: bold;
    }

    /* Zone de contenu */
    main { flex-grow: 1; height: 100vh; overflow: auto; background: #fdf6ec; }
    .tab-content { display: none; height: 100%; width: 100%; border: none; }
    .tab-content.active { display: block; }

    /* Disposition Mobile sans défilement */
    @media (max-width: 768px) {
      body { flex-direction: column; }
      nav { 
        width: 100%; 
        height: auto; 
        padding: 6px 4px; 
        border-right: none; 
        border-bottom: 2px solid #7a4a1f; 
      }
      
      .app-title {
        padding: 2px 0 6px 0;
        margin-bottom: 4px;
        font-size: 0.85rem;
        border-bottom: 1px solid #282828;
      }

      /* Grille fixe 5 boutons sans défilement */
      nav ul { 
        display: grid; 
        grid-template-columns: repeat(5, 1fr); 
        gap: 3px; 
        background: transparent; 
      }
      nav li { 
        padding: 6px 2px; 
        font-size: 0.7rem; 
        justify-content: center; 
        text-align: center; 
        border-radius: 4px;
        background: #242424;
        white-space: normal;
        line-height: 1.1;
      }
      nav li.active {
        background: #7a4a1f;
      }
    }
  </style>
</head>
<body>

  <nav>
    <div class="app-title">Yoann's French Bakery</div>
    <ul>
      <li class="tab-btn active" onclick="showTab('tab-recettes', this)">🍞<br>Recettes</li>
      <li class="tab-btn" onclick="showTab('tab-sans-gluten', this)">🌾<br>Sans Gluten</li>
      <li class="tab-btn" onclick="showTab('tab-ingredients', this)">🏷️<br>Ingrédients</li>
      <li class="tab-btn" onclick="showTab('tab-couts', this)">💰<br>Coûts</li>
      <li class="tab-btn" onclick="showTab('tab-commandes', this)">📋<br>Commandes</li>
    </ul>
  </nav>

  <main>
    <iframe id="tab-recettes" class="tab-content active" src="recettes.html"></iframe>
    <iframe id="tab-sans-gluten" class="tab-content" src="pain_sans_gluten.html"></iframe>
    <iframe id="tab-ingredients" class="tab-content" src="ingredients-master.html"></iframe>
    <iframe id="tab-couts" class="tab-content" src="prix-de-revient.html"></iframe>
    <iframe id="tab-commandes" class="tab-content" src="commandes-demain.html"></iframe>
  </main>

  <script>
    function showTab(tabId, element) {
      document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));

      document.getElementById(tabId).classList.add('active');
      element.classList.add('active');
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
